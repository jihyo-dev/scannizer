[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "scannizer"
version = "0.1.0"
description = "Make a clean PDF look like it was scanned."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Chizi" }]
keywords = ["pdf", "scan", "scanner", "noise", "augmentation"]
classifiers = [
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Graphics",
]
dependencies = [
  "pypdfium2>=4.30",
  "numpy>=1.26",
  "opencv-python-headless>=4.9",
]

[project.scripts]
scannizer = "scannizer.cli:main"

[project.urls]
Homepage = "https://github.com/chizi-develop/scannizer"

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["scannizer", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
